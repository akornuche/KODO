version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kodo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kodo_user
      POSTGRES_PASSWORD: kodo_password
      POSTGRES_DB: kododb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodo_user -d kododb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer - Database Management UI (Optional)
  adminer:
    image: adminer:latest
    container_name: kodo_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # Redis (Optional - for rate limiting / caching)
  redis:
    image: redis:7-alpine
    container_name: kodo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: kodo_network
