<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#10b981"/>
  
  <!-- Gradient Overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  
  <!-- Logo/Brand Circle -->
  <circle cx="600" cy="250" r="80" fill="#ffffff" opacity="0.2"/>
  <circle cx="600" cy="250" r="60" fill="#ffffff"/>
  
  <!-- K Letter -->
  <text x="600" y="285" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#10b981" text-anchor="middle">K</text>
  
  <!-- Brand Name -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle">KODO</text>
  
  <!-- Tagline -->
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" opacity="0.9" text-anchor="middle">Buy, Sell &amp; Deliver with Real-time Tracking</text>
  
  <!-- Location Badge -->
  <rect x="500" y="480" width="200" height="50" rx="25" fill="#ffffff" opacity="0.2"/>
  <text x="600" y="515" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">🇳🇬 Nigeria</text>
</svg>
