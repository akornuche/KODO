<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Application icons -->
    <link rel="icon" type="image/svg+xml" href="/kodo-icon.svg" />
    <link rel="apple-touch-icon" href="/kodo-icon.svg" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Mobile optimizations -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KODO" />
    
    <!-- Theme colors -->
    <meta name="theme-color" content="#10b981" />
    <meta name="msapplication-TileColor" content="#10b981" />
    <meta name="msapplication-TileImage" content="/kodo-icon.svg" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Buy, sell, and deliver goods with real-time tracking and secure payments across Nigeria. Join KODO marketplace today." />
    <meta name="keywords" content="marketplace Nigeria, online shopping, delivery tracking, secure payments, e-commerce, courier services, buy and sell" />
    <meta name="author" content="KODO" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kodo.com/" />
    <meta property="og:site_name" content="KODO Marketplace" />
    <meta property="og:title" content="KODO - Buy, Sell & Deliver with Real-time Tracking" />
    <meta property="og:description" content="Nigeria's leading marketplace with secure escrow payments and GPS tracking. Shop electronics, fashion, and more." />
    <meta property="og:image" content="https://kodo.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@KODOMarket" />
    <meta name="twitter:creator" content="@KODOMarket" />
    <meta name="twitter:url" content="https://kodo.com/" />
    <meta name="twitter:title" content="KODO - Buy, Sell & Deliver with Real-time Tracking" />
    <meta name="twitter:description" content="Nigeria's leading marketplace with secure escrow payments and GPS tracking" />
    <meta name="twitter:image" content="https://kodo.com/og-image.png" />

    <!-- Performance optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.kodo.com" />
    
    <!-- Splash screens are generated by the native shell when available -->

    <title>KODO - Buy, Sell & Deliver with Real-time Tracking in Nigeria</title>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 50px;">
        <h1>JavaScript Required</h1>
        <p>This application requires JavaScript to function properly. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
